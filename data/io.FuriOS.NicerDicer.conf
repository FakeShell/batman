<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->

<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="io.FuriOS.NicerDicer"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.FuriOS.NicerDicer" send_interface="io.FuriOS.NicerDicer"/>
    <allow send_destination="io.FuriOS.NicerDicer" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="io.FuriOS.NicerDicer" send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.FuriOS.NicerDicer" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
